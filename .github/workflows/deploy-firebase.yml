name: Deploy to Firebase

# Publishes the Firebase Hosting config (firebase.json) for the live channel.
# Hosting serves NO static build — every request is proxied to the
# `flipper-production` Cloud Run service via the `**` rewrite, so this
# workflow needs no Node/pnpm/Next build. The app image itself is built and
# deployed by ci.yml (build-container + deploy-cloud-run).

on:
  push:
    branches:
      - main

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Hosting proxy config
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
